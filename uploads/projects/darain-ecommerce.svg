<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="dbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140b24"/>
      <stop offset="100%" stop-color="#23123d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#dbg)"/>
  <circle cx="300" cy="180" r="160" fill="#a855f7" opacity="0.15" filter="blur(40px)"/>
  <circle cx="950" cy="500" r="190" fill="#ec4899" opacity="0.12" filter="blur(40px)"/>
  <g transform="translate(100, 60)">
    <rect width="1000" height="580" rx="16" fill="#1e1433" stroke="#372658" stroke-width="1.5"/>
    <rect width="1000" height="48" rx="16" fill="#170e28"/>
    <rect y="32" width="1000" height="16" fill="#170e28"/>
    <circle cx="28" cy="24" r="6" fill="#ef4444"/>
    <circle cx="48" cy="24" r="6" fill="#f59e0b"/>
    <circle cx="68" cy="24" r="6" fill="#10b981"/>
    <text x="500" y="29" fill="#c084fc" font-family="Segoe UI,Roboto" font-size="13" font-weight="600" text-anchor="middle">store.darain.example/catalog</text>

    <!-- Top store header -->
    <rect x="40" y="75" width="920" height="60" rx="12" fill="#281a44" stroke="#41296e" stroke-width="1"/>
    <text x="65" y="112" fill="#ffffff" font-family="Segoe UI,Roboto" font-size="20" font-weight="800">DARAIN <tspan fill="#ec4899">COLLECTION</tspan></text>
    <rect x="760" y="87" width="180" height="36" rx="8" fill="#9333ea"/>
    <text x="850" y="110" fill="#ffffff" font-family="Segoe UI,Roboto" font-size="12" font-weight="700" text-anchor="middle">🛒 Cart: 3 items (₹ 4,890)</text>

    <!-- Product 1 -->
    <rect x="40" y="160" width="280" height="350" rx="12" fill="#23173d" stroke="#3b255f" stroke-width="1"/>
    <rect x="60" y="180" width="240" height="180" rx="8" fill="#321e54"/>
    <circle cx="180" cy="270" r="50" fill="#9333ea" opacity="0.6"/>
    <text x="180" y="278" fill="#ffffff" font-family="Segoe UI,Roboto" font-size="14" font-weight="700" text-anchor="middle">PREMIUM MERCH</text>
    <text x="60" y="390" fill="#ffffff" font-family="Segoe UI,Roboto" font-size="15" font-weight="700">Artisan Linen Kurta</text>
    <text x="60" y="415" fill="#c084fc" font-family="Segoe UI,Roboto" font-size="16" font-weight="800">₹ 1,799 <tspan fill="#64748b" font-size="12" text-decoration="line-through">₹ 2,499</tspan></text>
    <rect x="60" y="440" width="240" height="38" rx="8" fill="#ec4899"/>
    <text x="180" y="464" fill="#ffffff" font-family="Segoe UI,Roboto" font-size="12" font-weight="700" text-anchor="middle">Add to Bag</text>

    <!-- Product 2 -->
    <rect x="360" y="160" width="280" height="350" rx="12" fill="#23173d" stroke="#3b255f" stroke-width="1"/>
    <rect x="380" y="180" width="240" height="180" rx="8" fill="#321e54"/>
    <circle cx="500" cy="270" r="50" fill="#ec4899" opacity="0.6"/>
    <text x="500" y="278" fill="#ffffff" font-family="Segoe UI,Roboto" font-size="14" font-weight="700" text-anchor="middle">FOOTWEAR</text>
    <text x="380" y="390" fill="#ffffff" font-family="Segoe UI,Roboto" font-size="15" font-weight="700">Handcrafted Leather Sandals</text>
    <text x="380" y="415" fill="#c084fc" font-family="Segoe UI,Roboto" font-size="16" font-weight="800">₹ 2,199</text>
    <rect x="380" y="440" width="240" height="38" rx="8" fill="#ec4899"/>
    <text x="500" y="464" fill="#ffffff" font-family="Segoe UI,Roboto" font-size="12" font-weight="700" text-anchor="middle">Add to Bag</text>

    <!-- Product 3 -->
    <rect x="680" y="160" width="280" height="350" rx="12" fill="#23173d" stroke="#3b255f" stroke-width="1"/>
    <rect x="700" y="180" width="240" height="180" rx="8" fill="#321e54"/>
    <circle cx="820" cy="270" r="50" fill="#3b82f6" opacity="0.6"/>
    <text x="820" y="278" fill="#ffffff" font-family="Segoe UI,Roboto" font-size="14" font-weight="700" text-anchor="middle">ACCESSORY</text>
    <text x="700" y="390" fill="#ffffff" font-family="Segoe UI,Roboto" font-size="15" font-weight="700">Woven Heritage Scarf</text>
    <text x="700" y="415" fill="#c084fc" font-family="Segoe UI,Roboto" font-size="16" font-weight="800">₹ 899</text>
    <rect x="700" y="440" width="240" height="38" rx="8" fill="#ec4899"/>
    <text x="820" y="464" fill="#ffffff" font-family="Segoe UI,Roboto" font-size="12" font-weight="700" text-anchor="middle">Add to Bag</text>
